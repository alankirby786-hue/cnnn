"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "mirror/edition.cnn.com"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Edge function applies to all routes in production. Configure env vars in Netlify UI.
# Disabled for now to allow public access. Re-enable with proper env vars when ready.
# [[edge_functions]]
#   function = "access-gate"
#   path = "/*"

[[redirects]]
  from = "/markets/edward-jones-louisiana-investigation"
  to = "/markets/live-news-update/"
  status = 301
  force = true

[[redirects]]
  from = "/markets/edward-jones-louisiana-investigation/*"
  to = "/markets/live-news-update/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/content"
  to = "https://cnn-news-live.netlify.app/api/content"
  status = 200
  force = true

[[redirects]]
  from = "/api/peak"
  to = "https://cnn-news-live.netlify.app/api/peak"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "https://cnn-news-live.netlify.app/api/subscribe"
  status = 200
  force = true

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
